llm_task_planner_node:
  ros__parameters:
    api_protocol: "chat_completions"
    api_base_url: "http://127.0.0.1:8000/v1/chat/completions"
    api_key: "EMPTY"
    api_key_env_var: ""
    api_key_required: false
    model: "Qwen/Qwen3-4B"
    reasoning_effort: ""
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 256
    request_timeout_sec: 90.0
    extra_request_body_json: '{"top_k": 20, "chat_template_kwargs": {"enable_thinking": false}}'
    open_vocabulary_targets: true
    enable_grasp_actions: false
    enable_rcm_actions: true
    allow_local_fallback: true
